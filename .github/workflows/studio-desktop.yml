name: Saya Studio Windows and macOS

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Optional existing run ID: retest its exact installers without rebuilding'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 EXE
            os: windows-latest
            artifact: windows-x64
          - name: macOS Apple Silicon DMG
            os: macos-15
            artifact: macos-arm64
          - name: macOS Intel DMG
            os: macos-15-intel
            artifact: macos-x64
    defaults:
      run:
        working-directory: studio
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: ${{ !inputs.build_run }}
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ !inputs.build_run }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio
          key: ${{ matrix.artifact }}
          cache-on-failure: true
      - if: ${{ !inputs.build_run }}
        run: npm ci
      - name: Python bridge process safety
        run: |
          python scripts/desktop-process.test.py
          python scripts/civitai-bridge.test.py
      - name: Native core checks
        if: ${{ !inputs.build_run }}
        run: cargo test -p studio-core --locked --lib platform_tests
      - name: Native browser host protocol
        if: ${{ !inputs.build_run }}
        run: cargo test -p studio-core --locked --lib browser_host::tests
      - name: Native recycle bin and restore
        if: ${{ !inputs.build_run }}
        run: cargo test -p studio-core --locked --lib native_trash::tests::native_recycle_roundtrip -- --ignored
      - name: Build native installer
        if: ${{ !inputs.build_run }}
        run: npx tauri build
      - name: Collect installer
        if: ${{ !inputs.build_run }}
        env:
          PLATFORM: ${{ matrix.artifact }}
        run: |
          python - <<'PYCODE'
          import os, pathlib, shutil, json
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          platform = os.environ['PLATFORM']
          suffix = 'exe' if platform.startswith('windows') else 'dmg'
          files = list(pathlib.Path('target/release/bundle').glob(f'**/*.{suffix}'))
          assert len(files) == 1, files
          dest = pathlib.Path('../dist-release')
          dest.mkdir(exist_ok=True)
          shutil.copy2(files[0], dest / f'saya-studio-{version}-{platform}.{suffix}')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.build_run }}
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist-release/*.exe
            dist-release/*.dmg
          if-no-files-found: error
      - name: Retrieve exact installers for a smoke-only rerun
        if: ${{ inputs.build_run }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-release
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Browser test tools (CI only)
        run: |
          npm install --prefix "$RUNNER_TEMP/saya-browser-test" --no-audit --no-fund playwright@1.64.1
          node "$RUNNER_TEMP/saya-browser-test/node_modules/playwright/cli.js" install chromium
      - name: Install and start the native package
        run: python scripts/desktop-package-smoke.py "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}-smoke
          path: |
            dist-release/*-smoke.json
            dist-release/*-startup.log
